<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Scientific Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="theme-toggle">
    <label class="switch">
        <input type="checkbox" id="themeSwitch">
        <span class="slider"></span>
    </label>
</div>

<div class="container glass">

    <!-- TAB BUTTONS -->
    <div class="tabs">
        <button class="tab-button active" onclick="openTab('calc')">Calculator</button>
        <button class="tab-button" onclick="openTab('graph')">Graph</button>
        <button class="tab-button" onclick="openTab('history')">History</button>
    </div>

    <!-- CALCULATOR TAB -->
    <div id="calc" class="tab active">
        <input type="text" id="display" disabled>

        <div class="buttons">
            <button onclick="press('sin(')">sin</button>
            <button onclick="press('cos(')">cos</button>
            <button onclick="press('tan(')">tan</button>
            <button onclick="press('Math.log(')">ln</button>
            <button onclick="press('Math.sqrt(')">√</button>

            <button onclick="press('7')">7</button>
            <button onclick="press('8')">8</button>
            <button onclick="press('9')">9</button>
            <button onclick="press('/')">/</button>

            <button onclick="press('4')">4</button>
            <button onclick="press('5')">5</button>
            <button onclick="press('6')">6</button>
            <button onclick="press('*')">*</button>

            <button onclick="press('1')">1</button>
            <button onclick="press('2')">2</button>
            <button onclick="press('3')">3</button>
            <button onclick="press('-')">-</button>

            <button onclick="press('0')">0</button>
            <button onclick="press('.')">.</button>
            <button onclick="calculate()">=</button>
            <button onclick="press('+')">+</button>

            <button class="clear" onclick="clearDisplay()">C</button>
        </div>
    </div>

    <!-- GRAPH TAB -->
    <div id="graph" class="tab">
        <input type="text" id="graphInput" placeholder="Enter function: e.g. sin(x), x*x, tan(x)">
        <button class="plot-btn" onclick="plotGraph()">Plot</button>
        <canvas id="graphCanvas"></canvas>
    </div>

    <!-- HISTORY TAB -->
    <div id="history" class="tab">
        <h3>History</h3>
        <ul id="historyList"></ul>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
